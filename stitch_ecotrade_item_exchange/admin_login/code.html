<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EcoTrade Admin Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#42493e",
                        "on-primary": "#ffffff",
                        "tertiary": "#6a210d",
                        "on-tertiary-fixed": "#3c0800",
                        "on-background": "#1c1c11",
                        "secondary-fixed": "#d9e6da",
                        "on-tertiary-fixed-variant": "#7c2e19",
                        "on-primary-fixed-variant": "#23501e",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e6e3d0",
                        "inverse-on-surface": "#f4f1de",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#ffdbd2",
                        "tertiary-fixed-dim": "#ffb4a1",
                        "surface-variant": "#e6e3d0",
                        "on-primary-container": "#9dd090",
                        "surface-dim": "#dddbc8",
                        "on-primary-fixed": "#002201",
                        "secondary-fixed-dim": "#bdcabe",
                        "on-tertiary-container": "#ffb09b",
                        "surface-container-high": "#ece9d6",
                        "surface-bright": "#fdfae7",
                        "on-error": "#ffffff",
                        "inverse-surface": "#313124",
                        "primary-container": "#2d5a27",
                        "primary-fixed-dim": "#a1d494",
                        "surface-container": "#f1eedb",
                        "error": "#ba1a1a",
                        "tertiary-container": "#883721",
                        "on-tertiary": "#ffffff",
                        "outline-variant": "#c2c9bb",
                        "on-secondary": "#ffffff",
                        "surface": "#fdfae7",
                        "secondary-container": "#d9e6da",
                        "on-surface": "#1c1c11",
                        "on-secondary-fixed-variant": "#3e4a41",
                        "primary-fixed": "#bcf0ae",
                        "outline": "#72796e",
                        "inverse-primary": "#a1d494",
                        "on-secondary-container": "#5b675e",
                        "surface-container-low": "#f7f4e1",
                        "secondary": "#556158",
                        "primary": "#154212",
                        "on-error-container": "#93000a",
                        "surface-tint": "#3b6934",
                        "on-secondary-fixed": "#131e17",
                        "background": "#fdfae7"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "48px",
                        "base": "4px",
                        "md": "24px",
                        "sm": "16px",
                        "lg": "32px",
                        "margin": "20px",
                        "xs": "8px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "display-lg-mobile": ["Outfit"],
                        "label-md": ["Outfit"],
                        "body-sm": ["Outfit"],
                        "body-lg": ["Outfit"],
                        "headline-md": ["Outfit"],
                        "body-md": ["Outfit"],
                        "display-lg": ["Outfit"],
                        "headline-sm": ["Outfit"]
                    },
                    "fontSize": {
                        "display-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "26px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Outfit', sans-serif;
        }
        .bg-pattern {
            background-color: #fdfae7;
            background-image: radial-gradient(#c2c9bb 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(21, 66, 18, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin bg-pattern antialiased">
<!-- Note: TopAppBar and Navigation Components are intentionally suppressed for this transactional login screen to prioritize the content canvas. -->
<div class="w-full max-w-md">
<!-- Branding Header -->
<div class="text-center mb-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container text-on-primary-container mb-sm shadow-sm">
<span class="material-symbols-outlined text-[32px]">admin_panel_settings</span>
</div>
<h1 class="font-display-lg text-display-lg text-primary">EcoTrade</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-base">Management Portal</p>
</div>
<!-- Login Card -->
<div class="glass-card rounded-[24px] p-lg sm:p-xl transition-all duration-300 hover:shadow-[0_12px_40px_0_rgba(21,66,18,0.08)]">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-md">Secure Admin Access</h2>
<form class="space-y-sm">
<!-- Admin ID / Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-base" for="admin-id">Admin ID / Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">person</span>
</div>
<input class="w-full pl-[44px] pr-sm py-sm bg-secondary-fixed border-none rounded-xl focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest font-body-md text-body-md text-on-surface transition-colors" id="admin-id" name="admin-id" placeholder="Enter your credentials" type="text"/>
</div>
</div>
<!-- Security Key / Password -->
<div>
<div class="flex justify-between items-center mb-base">
<label class="block font-label-md text-label-md text-on-surface-variant" for="security-key">Security Key</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot Key?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">key</span>
</div>
<input class="w-full pl-[44px] pr-sm py-sm bg-secondary-fixed border-none rounded-xl focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest font-body-md text-body-md text-on-surface transition-colors" id="security-key" name="security-key" placeholder="Enter your security key" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="pt-sm">
<button class="w-full py-sm px-md bg-tertiary text-on-tertiary rounded-xl font-label-md text-label-md flex justify-center items-center gap-xs hover:bg-tertiary-container active:scale-[0.98] transition-all duration-200 shadow-md" type="button">
<span>Authenticate</span>
<span class="material-symbols-outlined text-[18px]">login</span>
</button>
</div>
</form>
</div>
<!-- Footer Links -->
<div class="text-center mt-lg">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                New moderator? 
                <a class="font-label-md text-label-md text-primary hover:underline ml-xs transition-colors" href="#">Request Access</a>
</p>
</div>
</div>
</body></html>
