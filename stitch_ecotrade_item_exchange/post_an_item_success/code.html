<script>
        // Simple confetti effect
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-container');
            const colors = ['#3b6934', '#a1d494', '#6a210d', '#bcf0ae']; // primary, inverse-primary, tertiary, primary-fixed
            
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti', 'rounded-full');
                
                // Randomize appearance
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                const size = Math.random() * 8 + 4;
                confetti.style.width = `${size}px`;
                confetti.style.height = `${size}px`;
                
                // Randomize position
                const startX = Math.random() * 100;
                const startY = Math.random() * 100;
                confetti.style.left = `${startX}%`;
                confetti.style.top = `${startY}%`;
                
                container.appendChild(confetti);
                
                // Animate
                const tx = (Math.random() - 0.5) * 200;
                const ty = (Math.random() - 0.5) * 200 - 100;
                const duration = Math.random() * 1000 + 1000;
                const delay = Math.random() * 500;
                
                confetti.animate([
                    { transform: 'translate(0, 0) scale(0)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(1) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: duration,
                    delay: delay,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
                    fill: 'forwards'
                });
            }
        });
    </script>
