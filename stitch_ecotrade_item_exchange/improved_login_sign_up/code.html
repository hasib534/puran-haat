<div>

                Apple

<script>
        function switchTab(tab) {
            const btnLogin = document.getElementById('tab-login');
            const btnSignup = document.getElementById('tab-signup');
            const loginFields = document.getElementById('login-fields');
            const signupFields = document.getElementById('signup-fields');
            const btnSubmit = document.getElementById('btn-submit');

            // Active/Inactive class sets
            const activeClasses = ['text-on-primary', 'bg-primary', 'shadow-sm'];
            const inactiveClasses = ['text-on-surface-variant', 'bg-transparent', 'hover:text-on-surface'];

            if (tab === 'login') {
                // Update Tabs
                btnLogin.classList.add(...activeClasses);
                btnLogin.classList.remove(...inactiveClasses);
                btnSignup.classList.add(...inactiveClasses);
                btnSignup.classList.remove(...activeClasses);

                // Update Form Content
                loginFields.classList.remove('hidden');
                loginFields.classList.add('block');
                signupFields.classList.add('hidden');
                signupFields.classList.remove('block');
                btnSubmit.textContent = 'Login';
            } else {
                // Update Tabs
                btnSignup.classList.add(...activeClasses);
                btnSignup.classList.remove(...inactiveClasses);
                btnLogin.classList.add(...inactiveClasses);
                btnLogin.classList.remove(...activeClasses);

                // Update Form Content
                signupFields.classList.remove('hidden');
                signupFields.classList.add('block');
                loginFields.classList.add('hidden');
                loginFields.classList.remove('block');
                btnSubmit.textContent = 'Create Account';
            }
        }
    </script>
