<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased">
<header class="w-full top-0 sticky bg-surface shadow-sm z-40 flex items-center justify-between px-margin py-base">
<button aria-label="Go back" class="text-primary hover:bg-primary-container/10 transition-colors active:scale-95 duration-150 p-2 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<span class="font-headline-md-mobile text-headline-md-mobile font-bold text-primary">EcoTrade</span>
<div class="w-10"></div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-margin py-lg">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(21,66,18,0.08)] p-md flex flex-col gap-md">
<div class="text-center flex flex-col gap-xs">
<span class="material-symbols-outlined text-primary text-[48px] mx-auto mb-xs icon-fill">lock_reset</span>
<h1 class="font-headline-md text-headline-md text-on-surface">Reset Password</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Please enter a new password below to secure your EcoTrade account.</p>
</div>
<form class="flex flex-col gap-md mt-sm">
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="new-password">New Password</label>
<div class="relative">
<input class="w-full bg-secondary-fixed text-on-surface rounded-lg border-none focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors py-3 pl-4 pr-12 font-body-md text-body-md placeholder:text-on-surface-variant/50" id="new-password" placeholder="Enter new password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant p-1 rounded-full hover:bg-primary-container/10 transition-colors" onclick="togglePassword('new-password', 'icon-new-password')" type="button">
<span class="material-symbols-outlined" id="icon-new-password">visibility_off</span>
</button>
</div>
</div>
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="confirm-password">Confirm New Password</label>
<div class="relative">
<input class="w-full bg-secondary-fixed text-on-surface rounded-lg border-none focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors py-3 pl-4 pr-12 font-body-md text-body-md placeholder:text-on-surface-variant/50" id="confirm-password" placeholder="Confirm new password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant p-1 rounded-full hover:bg-primary-container/10 transition-colors" onclick="togglePassword('confirm-password', 'icon-confirm-password')" type="button">
<span class="material-symbols-outlined" id="icon-confirm-password">visibility_off</span>
</button>
</div>
</div>
<div class="bg-surface-container-low rounded-lg p-sm flex flex-col gap-xs mt-xs">
<h3 class="font-label-md text-label-md text-on-surface">Password Requirements:</h3>
<ul class="flex flex-col gap-1">
<li class="flex items-center gap-2 font-body-sm text-body-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-primary">check_circle</span> At least 8 characters
                        </li>
<li class="flex items-center gap-2 font-body-sm text-body-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-primary">check_circle</span> Includes a number
                        </li>
<li class="flex items-center gap-2 font-body-sm text-body-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-outline">radio_button_unchecked</span> Includes a special character
                        </li>
</ul>
</div>
<button class="w-full bg-tertiary text-on-tertiary font-label-md text-label-md py-3 rounded-full hover:bg-tertiary/90 active:scale-95 transition-all duration-200 mt-sm shadow-md shadow-tertiary/20" type="button">
                    Reset Password
                </button>
</form>
</div>
</main>
<script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }
    </script>
