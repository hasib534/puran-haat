<body class="bg-background text-on-surface antialiased min-h-screen pb-[100px]"> <!-- Padding bottom for fixed save button -->
<!-- Header: Task-focused screen, nav shell suppressed, custom back/cancel header -->
<header class="flex items-center justify-between px-margin py-sm sticky top-0 bg-background/95 backdrop-blur-md z-40">
<button class="text-primary font-label-md text-label-md py-2 px-1 -ml-1 active:opacity-70 transition-opacity flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
<h1 class="font-headline-md-mobile text-headline-md-mobile text-primary font-bold">Edit Profile</h1>
<div class="w-8"></div> <!-- Spacer to center title -->
</header>
<main class="px-margin pt-sm pb-xl max-w-2xl mx-auto">
<!-- Avatar Section -->
<section class="flex flex-col items-center justify-center mb-lg">
<div class="relative w-[104px] h-[104px] rounded-full overflow-hidden shadow-[0_4px_20px_rgba(21,66,18,0.08)] border-4 border-surface-container-highest group">
<img class="w-full h-full object-cover" data-alt="A bright, high-quality profile portrait of a smiling young woman with curly hair, standing in a sunny greenhouse surrounded by lush green plants. Warm, natural lighting, soft focus background, evoking a friendly, organic, and sustainable community vibe." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAX_fYJthHHAekO33mzW_6w6cfSrdApQRxkg-ldCDqhGaO3vbVLj6RAam9Z3B-EwNeibgkyLMWuo2GNbgYHkjEOdcfWCbxDZKJyKmvpz_1JcBEbtFj-5SjUxepQhVzP-VrMBWzWqZNUviFdHyi7CgaXfq5TvHIbkW8RTUS0i2ewszmxMRnVFcY0PlvdA6hsqxtUInNqZnLMv-3zJeNVH6L1ozLvo08Mp5Nc8AwPnTOueiw74WVZS_BF"/>
<!-- Overlay for edit -->
<div class="absolute inset-0 bg-inverse-surface/40 flex items-center justify-center cursor-pointer opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity duration-200">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">add_a_photo</span>
</div>
</div>
<button class="mt-sm font-label-md text-label-md text-tertiary-container hover:text-tertiary transition-colors">Change Photo</button>
</section>
<!-- Form Fields -->
<section class="space-y-md mb-lg">
<!-- Full Name -->
<div>
<label class="block font-label-md text-label-md text-secondary mb-base ml-1" for="fullName">Full Name</label>
<div class="relative">
<input class="w-full bg-secondary-container text-on-surface font-body-md text-body-md rounded-xl px-4 py-3.5 border-none focus:ring-2 focus:ring-primary focus:bg-surface transition-all outline-none shadow-inner shadow-primary/5 placeholder:text-on-surface-variant/50" id="fullName" type="text" value="Maya Lin"/>
</div>
</div>
<!-- Username -->
<div>
<label class="block font-label-md text-label-md text-secondary mb-base ml-1" for="username">Username</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 font-body-md text-body-md">@</span>
<input class="w-full bg-secondary-container text-on-surface font-body-md text-body-md rounded-xl pl-8 pr-4 py-3.5 border-none focus:ring-2 focus:ring-primary focus:bg-surface transition-all outline-none shadow-inner shadow-primary/5" id="username" type="text" value="maya_upcycles"/>
</div>
</div>
<!-- Bio -->
<div>
<label class="block font-label-md text-label-md text-secondary mb-base ml-1" for="bio">Bio</label>
<textarea class="w-full bg-secondary-container text-on-surface font-body-md text-body-md rounded-xl px-4 py-3.5 border-none focus:ring-2 focus:ring-primary focus:bg-surface transition-all outline-none resize-none shadow-inner shadow-primary/5 leading-relaxed" id="bio" rows="4">Passionate about restoring old furniture and growing urban tomatoes. Always happy to trade seeds or advice! Let's build a greener neighborhood together.</textarea>
</div>
<!-- Location -->
<div>
<label class="block font-label-md text-label-md text-secondary mb-base ml-1" for="location">Location</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary text-[20px]">location_on</span>
<input class="w-full bg-secondary-container text-on-surface font-body-md text-body-md rounded-xl pl-10 pr-4 py-3.5 border-none focus:ring-2 focus:ring-primary focus:bg-surface transition-all outline-none shadow-inner shadow-primary/5" id="location" type="text" value="Portland, OR"/>
</div>
</div>
</section>
<!-- Social Links Section -->
<section class="mb-lg">
<h2 class="font-headline-sm-mobile text-headline-sm-mobile text-primary mb-xs">Trust &amp; Verification</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-sm">Connect your social accounts to help neighbors know you're real.</p>
<div class="space-y-xs">
<!-- Instagram -->
<div class="flex items-center justify-between bg-surface rounded-xl p-3.5 shadow-[0_2px_10px_rgba(21,66,18,0.04)] border border-surface-variant/50">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary-container" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
<span class="font-body-md text-body-md text-on-surface font-medium">Instagram</span>
</div>
<button class="font-label-md text-label-md text-primary bg-primary-container/30 px-4 py-2 rounded-full hover:bg-primary-container/50 active:scale-95 transition-all">Connect</button>
</div>
<!-- Facebook (Connected State) -->
<div class="flex items-center justify-between bg-surface rounded-xl p-3.5 shadow-[0_2px_10px_rgba(21,66,18,0.04)] border border-surface-variant/50">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">group</span>
</div>
<div>
<span class="font-body-md text-body-md text-on-surface font-medium block leading-tight">Facebook</span>
<span class="font-body-sm text-body-sm text-secondary block text-[12px]">Maya Lin</span>
</div>
</div>
<button class="font-label-md text-label-md text-secondary bg-surface-container px-4 py-2 rounded-full flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">check</span>
                        Connected
                    </button>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-margin bg-gradient-to-t from-background via-background to-transparent pt-xl pb-margin z-50">
<button class="w-full max-w-2xl mx-auto block bg-tertiary text-on-tertiary font-label-md text-label-md py-4 rounded-xl shadow-[0_8px_20px_rgba(106,33,13,0.25)] active:scale-[0.98] transition-transform duration-200 uppercase tracking-widest">
            Save Changes
        </button>
</div>
