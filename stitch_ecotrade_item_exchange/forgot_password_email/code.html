<button class="text-on-surface-variant hover:bg-primary-container/10 transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-headline-md-mobile text-headline-md-mobile font-bold text-primary dark:text-primary-fixed">EcoTrade</span>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center p-margin">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(21,66,18,0.08)] p-md flex flex-col gap-lg relative overflow-hidden">
<!-- Decorative Background Element -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary-container rounded-full blur-3xl opacity-20 pointer-events-none"></div>
<!-- Header Section -->
<div class="flex flex-col gap-xs text-center z-10">
<div class="w-16 h-16 bg-secondary-container rounded-full flex items-center justify-center mx-auto mb-sm shadow-sm">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="lock_reset" style="font-variation-settings: 'FILL' 1;">lock_reset</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary">Forgot Password?</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto">
                    Enter the email address associated with your EcoTrade account, and we'll send you a link to reset your password.
                </p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-md z-10">
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-secondary pointer-events-none" data-icon="mail">mail</span>
<input class="w-full bg-secondary-container/30 border border-outline-variant/50 rounded-lg py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface focus:bg-surface-container-lowest focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200 placeholder:text-on-surface-variant/50" id="email" name="email" placeholder="neighbor@example.com" required="" type="email"/>
</div>
</div>
<button class="w-full bg-tertiary text-on-tertiary rounded-full py-3 px-6 font-headline-sm text-headline-sm shadow-md hover:shadow-lg hover:bg-tertiary/90 active:scale-95 transition-all duration-200 flex items-center justify-center gap-xs mt-sm" type="button">
<span>Send Reset Link</span>
<span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="text-center z-10 mt-sm border-t border-outline-variant/20 pt-md">
<p class="font-body-sm text-body-sm text-on-surface-variant">
