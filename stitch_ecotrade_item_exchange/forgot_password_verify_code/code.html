<script>
        // Simple OTP input logic for auto-advance
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Only allow numbers
                    e.target.value = e.target.value.replace(/[^0-9]/g, '');
                    
                    if (e.target.value !== '') {
                        // Move to next
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    }
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '') {
                        // Move to previous on backspace if empty
                        if (index > 0) {
                            inputs[index - 1].focus();
                        }
                    }
                });
                
                // Handle paste
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text/plain').replace(/[^0-9]/g, '').slice(0, 6);
                    
                    for(let i = 0; i < pastedData.length; i++) {
                        if(inputs[i]) {
                            inputs[i].value = pastedData[i];
                        }
                    }
                    
                    // Focus next empty or last input
                    const nextInput = inputs[pastedData.length] || inputs[inputs.length - 1];
                    nextInput.focus();
                });
            });
            
            // Auto focus first input on load
            if(inputs.length > 0) {
                setTimeout(() => inputs[0].focus(), 300); // Slight delay for animation/render
            }
        });
    </script>
